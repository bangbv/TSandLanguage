name: 'llama-7b-chat'
model_name: '7b-chat' # The model name, used for loading the model
temp: 1.0     # 0-1 controls the creativity/randomness of the generated text. 1 means very random
alpha: 0.99   # This is for data preprecssing, scaler.
beta: 0.3    # This is for data preprecssing, scaler.
basic: True  # This is for data preprecssing, scaler.
top_p: 0.8
context_lengths: 4096 # All llama context length is 4096. GPT is 4097

# Embedding vector configuration
use_embeddings: False  # Set to True to use embedding vectors instead of tokenization
embedding_dim: 4096    # Embedding dimension (should match LLaMA hidden size)
max_sequence_length: 512  # Maximum sequence length for embeddings
settings: 
  base: 10 
  prec: 3 
  signed: True 
  fixed_length: False 
  max_val: 10000000.0 
  time_sep: ', '
  bit_sep: '' 
  plus_sign: '' 
  minus_sign: '-' 
  half_bin_correction: True 
  decimal_point: '' 
  missing_str: ' Nan'
decompose:
  is_decompose: True # whether to decompose the time series data
  period: 7 # the period of the time series data
  robust: True # whether to use robust decomposition
